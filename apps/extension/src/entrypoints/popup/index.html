<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L@tr.link</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#" aria-label="L@tr.link"><img src="/icon/32.png" alt="" width="28" height="28" />L@tr.link</a>
      <a id="settings" class="icon-button" href="#" aria-label="Settings">⚙</a>
    </header>
    <main>
      <p id="loading" class="loading" role="status">Opening your library…</p>
      <section id="signed-out" class="panel hidden" aria-labelledby="login-heading">
        <div class="login-mark" aria-hidden="true">↗</div>
        <h1 id="login-heading">Keep It for L@tr.</h1>
        <p class="subtitle">Sign in to save to your library.</p>
        <form id="login-form">
          <label for="handle">Bluesky Handle</label>
          <input id="handle" type="text" placeholder="you.bsky.social" autocomplete="username" autocapitalize="none" spellcheck="false" required />
          <button id="sign-in" type="submit" class="primary">Sign In →</button>
        </form>
        <p id="auth-error" class="error hidden" role="alert"></p>
      </section>
      <section id="signed-in" class="panel hidden" aria-labelledby="save-heading">
        <article class="preview">
          <p id="site-name" class="site-name hidden"></p>
          <h1 id="save-heading">Save This Page</h1>
          <p id="page-description" class="description hidden"></p>
          <p id="tab-url" class="url-preview"></p>
        </article>
        <div class="tag-field">
          <label for="save-tags">Tags <span>optional</span></label>
          <div id="tag-chips" class="tag-chips hidden" aria-label="Tags to save"></div>
          <input id="save-tags" type="text" placeholder="Add a tag…" autocomplete="off" />
          <p id="tag-error" class="error hidden" role="alert"></p>
        </div>
        <button id="save" type="button" disabled class="primary">Save to Library</button>
        <p id="save-status" class="status" role="status" aria-live="polite"></p>
        <a id="open-library" class="library-link" href="#" target="_blank" rel="noopener">Open Library ↗</a>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
