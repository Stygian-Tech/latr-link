name: CI

# Railway deploys linked Git revisions. GitHub Actions verifies source changes
# and never connects to hosted databases or deploys infrastructure.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-gateway:
    name: Gateway test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run gateway CI
        run: bash scripts/ci-gateway.sh

  ci-js:
    name: Web, console, and extension test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Run JavaScript CI
        run: bash scripts/ci-js.sh
        env:
          NEXT_PUBLIC_APP_ENV: test

  required:
    name: CI — Required
    needs: [ci-gateway, ci-js]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          GATEWAY_RESULT: ${{ needs.ci-gateway.result }}
          JS_RESULT: ${{ needs.ci-js.result }}
        run: |
          test "$GATEWAY_RESULT" = success
          test "$JS_RESULT" = success
