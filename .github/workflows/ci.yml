name: CI

# Railway deploys linked Git revisions. GitHub Actions verifies source changes
# and never connects to hosted databases or deploys infrastructure.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-gateway:
    name: Gateway test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run gateway CI
        run: bash scripts/ci-gateway.sh

  ci-js:
    name: Web, console, and extension test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Run JavaScript CI
        run: bash scripts/ci-js.sh
        env:
          NEXT_PUBLIC_APP_ENV: test
      - name: Build and verify browser store packages
        run: bun run --cwd apps/extension package:stores
      - name: Upload browser store packages
        uses: actions/upload-artifact@v7
        with:
          name: latr-link-store-packages-${{ github.sha }}
          path: apps/extension/.output/store/
          retention-days: 14

  ci-apple:
    name: iPhone and iPad test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run native Apple checks
        run: bash scripts/ci-apple.sh

  ci-android:
    name: Android test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Run native Android checks
        run: bash scripts/ci-android.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd apps/android && ./gradlew --no-daemon connectedDevelopmentDebugAndroidTest

  required:
    name: CI — Required
    needs: [ci-gateway, ci-js, ci-apple, ci-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          GATEWAY_RESULT: ${{ needs.ci-gateway.result }}
          JS_RESULT: ${{ needs.ci-js.result }}
          APPLE_RESULT: ${{ needs.ci-apple.result }}
          ANDROID_RESULT: ${{ needs.ci-android.result }}
        run: |
          test "$GATEWAY_RESULT" = success
          test "$JS_RESULT" = success
          test "$APPLE_RESULT" = success
          test "$ANDROID_RESULT" = success
